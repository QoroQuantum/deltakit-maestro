[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deltakit-maestro"
version = "0.1.0"
description = "Qoro Maestro simulator backend for Riverlane Deltakit QEC circuits"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Qoro Quantum", email = "team@qoroquantum.de" }]
keywords = ["deltakit", "quantum", "simulator", "mps", "maestro", "qec", "sinter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=2.0",
    "deltakit>=0.8.0",
    "qoro-maestro[sinter]>=0.3.14,<0.4.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "pymatching>=2.2"]
examples = ["pymatching>=2.2", "ldpc>=2.0"]

[project.urls]
Homepage = "https://github.com/QoroQuantum/deltakit-maestro"
Repository = "https://github.com/QoroQuantum/deltakit-maestro"
Issues = "https://github.com/QoroQuantum/deltakit-maestro/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["deltakit_maestro*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv*", "*.md", "*.ipynb"]
